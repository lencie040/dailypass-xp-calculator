plugins {
    id 'fabric-loom' version '1.2-SNAPSHOT'
}

group = 'jp.dailypassxplink'
version = project.mod_version
base { archivesName = 'dailypass-xp-link' }

dependencies {
    minecraft 'com.mojang:minecraft:1.19.2'
    mappings 'net.fabricmc:yarn:1.19.2+build.28:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.14.25'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.77.0+1.19.2'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
    from('docs/index.html') { rename { 'calculator.html' } }
    from('docs') { include 'routes.html', 'routes.js' }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}
